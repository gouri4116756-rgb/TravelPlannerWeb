<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Find areas to stay near destinations in Karnataka and other Indian states.">
    <title>Places to stay — Yatra</title><link rel="stylesheet" href="../style.css">
    <script defer src="../js/data.js"></script><script defer src="../js/app.js"></script><script defer src="../js/hotels.js"></script>
  </head>
  <body>
    <header id="site-header"></header>
    <main>
      <section class="page-intro"><p class="eyebrow">Pick a base for your day out</p><h1 class="page-title">Find a place to land.</h1><p class="page-lede">These are suggested neighbourhoods and towns—not hotel listings, live prices or availability. Open Maps to search current stays and check details directly with each property.</p></section>
      <section aria-label="Stay-area suggestions">
        <div class="toolbar">
          <div class="field"><label for="hotel-state">State</label><select id="hotel-state"><option>Karnataka</option><option>Kerala</option><option>Goa</option><option>Tamil Nadu</option><option>Maharashtra</option></select></div>
          <div class="field"><label for="hotel-search">Search by town</label><input id="hotel-search" type="search" placeholder="Try Hampi or Gokarna"></div>
        </div>
        <p class="results-note" id="hotel-count" aria-live="polite"></p><div class="place-grid" id="hotel-results"></div>
      </section>
    </main><footer id="site-footer"></footer>
  </body>
</html>
